openapi: 3.0.0
paths:
  /:
    get:
      description: >-
        Returns the current status of the API along with its version and
        timestamp.
      operationId: wtg_root
      parameters: []
      responses:
        '200':
          description: API is up and running
          content:
            application/json:
              schema:
                example:
                  name: lynqa-api
                  status: ok
                  version: 1.0.0
                  docs: /api-docs
                  time: '2026-04-21T10:00:00.000Z'
      summary: Health check
      tags:
        - Root
  /health/live:
    get:
      operationId: D$_live
      parameters: []
      responses:
        '200':
          description: ''
      summary: Liveness probe — returns ok if the process is running
      tags:
        - Health
  /health/ready:
    get:
      operationId: D$_ready
      parameters: []
      responses:
        '200':
          description: ''
      summary: >-
        Readiness probe — returns ready status based on Databases and systems
        availability
      tags:
        - Health
  /hardMaintenance:
    get:
      operationId: Gtg_get
      parameters: []
      responses:
        '200':
          description: ''
      tags:
        - HardMaintenance
  /testRuns/{testRunId}/testSteps/{stepIndex}:
    get:
      operationId: Sgg_getTestRunStepStatus
      parameters:
        - name: stepIndex
          required: true
          in: path
          description: Index of the step to retrieve
          schema:
            type: number
            minimum: 0
        - name: testRunId
          required: true
          in: path
          description: ID of the test run
          schema:
            type: string
      responses:
        '200':
          description: >-
            Status report of the requested step, including executed commands and
            the outcome (timestamps, assertions report, verdict cause, or error
            depending on status).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StepReport'
        '401':
          description: Authentication failed
        '404':
          description: Test run step not found
        '429':
          description: Too many requests
      security:
        - apiKey: []
      summary: Get the status report of a specific step within a test run
      tags:
        - TestSteps
  /testRuns:
    post:
      operationId: bu_addTestRun
      parameters:
        - name: x-api-consumer
          required: true
          in: header
          description: >-
            Identifies the source application of the request. Supports
            hierarchical values separated by ":" (e.g.
            "jira:my-instance.atlassian.net").
          schema:
            type: string
      requestBody:
        required: true
        description: Test to execute
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTest'
      responses:
        '201':
          description: The test run id
          content:
            application/json:
              schema:
                type: string
                example: fphulpqp6jqwsgwwsza6q4ar
        '400':
          description: Test is malformed
        '401':
          description: Authentication failed
        '403':
          description: Not enough credits
        '422':
          description: URL is not safe
        '429':
          description: Too many requests
      security:
        - apiKey: []
      summary: Execute a manual test
      tags:
        - TestRuns
  /testRuns/batch:
    post:
      operationId: bu_addTestBatch
      parameters:
        - name: x-api-consumer
          required: true
          in: header
          description: >-
            Identifies the source application of the request. Supports
            hierarchical values separated by ":" (e.g.
            "jira:my-instance.atlassian.net").
          schema:
            type: string
      requestBody:
        required: true
        description: Batch of tests to execute
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTestBatch'
      responses:
        '201':
          description: The test run ids
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestRunIds'
        '400':
          description: Tests are malformed
        '401':
          description: Authentication failed
        '403':
          description: Not enough credits
        '422':
          description: URLs are not safe
        '429':
          description: Too many requests
      security:
        - apiKey: []
      summary: Execute a batch of manual and/or gherkin tests
      tags:
        - TestRuns
  /testRuns/gherkin:
    post:
      operationId: bu_addGherkinTestRun
      parameters:
        - name: x-api-consumer
          required: true
          in: header
          description: >-
            Identifies the source application of the request. Supports
            hierarchical values separated by ":" (e.g.
            "jira:my-instance.atlassian.net").
          schema:
            type: string
      requestBody:
        required: true
        description: Gherkin test to execute
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGherkinTest'
      responses:
        '201':
          description: The test run id
          content:
            application/json:
              schema:
                type: string
                example: fphulpqp6jqwsgwwsza6q4ar
        '400':
          description: Test is malformed
        '401':
          description: Authentication failed
        '403':
          description: Not enough credits
        '422':
          description: URL is not safe
        '429':
          description: Too many requests
      security:
        - apiKey: []
      summary: Execute a Gherkin test
      tags:
        - TestRuns
  /testRuns/{testRunId}:
    get:
      operationId: bu_getTestRun
      parameters:
        - name: testRunId
          required: true
          in: path
          description: ID of the test
          schema:
            type: string
      responses:
        '200':
          description: Test with steps
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Test'
                  - $ref: '#/components/schemas/GherkinTest'
        '401':
          description: Authentication failed
        '404':
          description: Test not found
        '410':
          description: Test run expired
        '429':
          description: Too many requests
      security:
        - apiKey: []
      summary: Get test with the specified ID
      tags:
        - TestRuns
    delete:
      operationId: bu_deleteTestRun
      parameters:
        - name: testRunId
          required: true
          in: path
          description: ID of the test run to delete
          schema:
            type: string
      responses:
        '204':
          description: Test run deleted
        '401':
          description: Authentication failed
        '404':
          description: Test run not found
        '429':
          description: Too many requests
      security:
        - apiKey: []
      summary: Delete a test run
      tags:
        - TestRuns
  /testRuns/{testRunId}/status:
    get:
      operationId: bu_getTestRunStatus
      parameters:
        - name: testRunId
          required: true
          in: path
          description: ID of the test
          schema:
            type: string
      responses:
        '200':
          description: Status of the test
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestRunStatus'
        '401':
          description: Authentication failed
        '404':
          description: Test run not found
        '410':
          description: Test run expired
        '429':
          description: Too many requests
      security:
        - apiKey: []
      summary: Get the status of the test with the specified ID
      tags:
        - TestRuns
  /testRuns/{testRunId}/fullStatus:
    get:
      operationId: bu_getTestRunFullStatus
      parameters:
        - name: testRunId
          required: true
          in: path
          description: ID of the test
          schema:
            type: string
      responses:
        '200':
          description: Full status of the test
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/TestRunFullStatus'
                  - $ref: '#/components/schemas/GherkinTestRunFullStatus'
        '401':
          description: Authentication failed
        '404':
          description: Test run not found
        '410':
          description: Test run expired
        '429':
          description: Too many requests
      security:
        - apiKey: []
      summary: Get the full status of the test with the specified ID
      tags:
        - TestRuns
  /testRuns/stop:
    post:
      operationId: bu_stopTestRuns
      parameters: []
      requestBody:
        required: true
        description: Ids of the test executions to stop
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StopTestRuns'
      responses:
        '202':
          description: Tests will be stopped
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoppedTestRuns'
        '400':
          description: Body is malformed
        '401':
          description: Authentication failed
        '429':
          description: Too many requests
      security:
        - apiKey: []
      summary: Stop a list manual test executions
      tags:
        - TestRuns
  /testRuns/query:
    post:
      operationId: bu_queryTestRuns
      parameters:
        - name: cursor
          required: false
          in: query
          description: Only return test runs from the cursor ID
          schema:
            type: number
        - name: limit
          required: false
          in: query
          description: Maximum number of results to return
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestRunsFilter'
      responses:
        '200':
          description: List of testRuns with nextCursor (for pagination)
        '400':
          description: Query is malformed
        '401':
          description: Authentication failed
        '429':
          description: Too many requests
      security:
        - apiKey: []
      summary: List paginated testRuns using filters
      tags:
        - TestRuns
  /testRuns/{testRunId}/screenshots/{screenshotId}:
    get:
      operationId: pgg_getScreenshot
      parameters:
        - name: testRunId
          required: true
          in: path
          description: ID of the test
          schema:
            type: string
        - name: screenshotId
          required: true
          in: path
          description: ID of the screenshot
          schema:
            type: string
      responses:
        '200':
          description: Screenshot is returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Screenshot'
        '401':
          description: Authentication failed
        '404':
          description: Screenshot not found
        '410':
          description: Test run expired
        '429':
          description: Too many requests
      security:
        - apiKey: []
      summary: Get the screenshot with the specified id among a specific test
      tags:
        - Screenshots
  /organization/credits:
    get:
      operationId: ht_getTotalCreditsByApiKey
      parameters: []
      responses:
        '200':
          description: Test execution credits count
          content:
            application/json:
              schema:
                type: number
        '401':
          description: Authentication failed
        '429':
          description: Too many requests
      summary: Get test execution credits for a specified API Key
      tags:
        - Organization
  /organization/purchases:
    get:
      operationId: ht_getPurchasesByApiKey
      parameters: []
      responses:
        '200':
          description: List of purchases
        '401':
          description: Authentication failed
        '429':
          description: Too many requests
      summary: List Credit Purchases for a specified API Key
      tags:
        - Organization
  /organization/creditLedger:
    get:
      operationId: ht_getCreditLedgerByApiKey
      parameters: []
      responses:
        '200':
          description: List of Credit Ledger entries
        '401':
          description: Authentication failed
        '429':
          description: Too many requests
      summary: Get Credit Ledger for a specified API Key
      tags:
        - Organization
  /changelog/raw:
    get:
      operationId: BwA_getRaw
      parameters: []
      responses:
        '200':
          description: Changelog in markdown format
      summary: Get raw Changelog - Markdown format
      tags:
        - Changelog
  /changelog/formatted:
    get:
      operationId: BwA_getFormatted
      parameters:
        - name: releasesCount
          required: true
          in: query
          description: Number of releases to fetch
          schema:
            type: number
      responses:
        '200':
          description: Changelog formatted
      summary: Get formatted Changelog
      tags:
        - Changelog
info:
  title: Lynqa API
  description: >+

    Agentic AI Test Execution.


    ---


    ## Last 2 releases [(↗ See full changelog
    here)](https://my.lynqa.smartesting.com/changelog)


    All notable changes to this API will be documented here.


    ## 2026-07-27


    ### Added


    - `POST /testRuns`: now has a `context.browserLocale` body property to
    request a specific locale for the browser, default is `en_US`


    ### Removed


    - `POST /testRuns`: body property `context.clientLanguage` does not exist
    anymore


    ### Changed


    Several API endpoints have been affected by the addition of organizations:


    - `GET /account/credits` - has become `GET /organization/credits`

    - `GET /account/purchases` - has become `GET /organization/purchases`

    - `GET /account/creditLedger` - has become `GET /organization/creditLedger`


    ## 2026-07-15


    ### Added


    - `POST /testRuns/batch`: create multiple test runs in a single request

  version: 1.0.0
  contact: {}
tags: []
servers:
  - url: https://api.lynqa.smartesting.com
components:
  securitySchemes:
    apiKey:
      type: apiKey
      name: x-api-key
      in: header
      description: Lynqa API key created from https://my.lynqa.smartesting.com/integration
  schemas:
    AssertionChecking:
      type: object
      properties:
        assertion:
          type: string
          description: The human-readable assertion text
          example: The page title contains "Dashboard"
        checked:
          type: boolean
          description: Whether the assertion evaluated to true
          example: true
      required:
        - assertion
        - checked
    AssertionsReport:
      type: object
      properties:
        assertions:
          description: List of checks performed for this step
          type: array
          items:
            $ref: '#/components/schemas/AssertionChecking'
        screenshot:
          type: string
          description: >-
            UUID of screenshot taken at assertion time (base64 or URL depending
            on configuration)
          example: 4b111ba4-c236-4770-67bf-0f17d0230e47
      required:
        - assertions
        - screenshot
    StepReport:
      type: object
      properties:
        commands:
          description: Commands executed during this step.
          oneOf:
            - $ref: '#/components/schemas/ClickCommand'
            - $ref: '#/components/schemas/DoubleClickCommand'
            - $ref: '#/components/schemas/FillCommand'
            - $ref: '#/components/schemas/SelectCommand'
            - $ref: '#/components/schemas/PressKeyCommand'
            - $ref: '#/components/schemas/ScrollCommand'
            - $ref: '#/components/schemas/HoverCommand'
            - $ref: '#/components/schemas/TypeCommand'
            - $ref: '#/components/schemas/DragCommand'
            - $ref: '#/components/schemas/GotoCommand'
        status:
          type: string
          description: Step execution status
          enum:
            - waiting
            - running
            - success
            - failed
            - error
            - stopped
            - not_run
          example: success
        start:
          format: date-time
          type: string
          description: >-
            Step start date. Present for RUNNING, STOPPED, SUCCESS, FAILED,
            ERROR
          example: '2025-09-18T09:01:02.000Z'
        end:
          format: date-time
          type: string
          description: Step end date. Present for STOPPED, SUCCESS, FAILED, ERROR
          example: '2025-09-18T09:01:05.500Z'
        assertionsReport:
          description: Assertions report (only for SUCCESS or FAILED)
          allOf:
            - $ref: '#/components/schemas/AssertionsReport'
        testVerdictCause:
          type: string
          description: In case of FAILED, describes why the step failed
          example: Expected URL to contain /dashboard
        error:
          type: string
          description: In case of ERROR, the internal error cause
          enum:
            - internal
          example: internal
      required:
        - commands
        - status
    TestData:
      type: object
      properties:
        name:
          type: string
          description: Name of the data
          example: password
        value:
          type: string
          description: Value of the data
          example: mys4cr4t!
      required:
        - name
        - value
    TestRunContext:
      type: object
      properties:
        browserLocale:
          type: string
          description: Browser locale code (ISO 639-1)_(ISO 3166-1 alpha-2)(.UTF-8)
          example: fr_FR
          examples:
            - fr_FR
            - en_US.UTF-8
            - es_ES
        clientDatetime:
          type: string
          description: Client locale datetime
          example: Thu Feb 26 2026 09:26:12 GMT+0100 (Central Europe time)
        secrets:
          description: Test data to inject in test steps
          type: array
          items:
            $ref: '#/components/schemas/TestData'
    TextualData:
      type: object
      properties:
        text:
          type: string
          example: The user is between 18 and 49
      required:
        - text
    CreateAttachment:
      type: object
      properties:
        name:
          type: string
          description: Name of the attachment
          example: invoice_260313.pdf
        data:
          type: string
          description: Base64 encoded data URI
          example: data:text/plain;base64,SGVsbG8gd29ybGQh
      required:
        - name
        - data
    CreateTestStep:
      type: object
      properties:
        action:
          type: string
          description: Test step action
          example: Click on the "Login" button
        expectedResult:
          type: string
          description: Test step assertion
          example: Verify that the user is logged-in
        guidance:
          description: Guidance to help the agent to execute the test
          type: array
          items:
            $ref: '#/components/schemas/TextualData'
        attachments:
          description: Attached files
          type: array
          items:
            $ref: '#/components/schemas/CreateAttachment'
      required:
        - action
    CreateTest:
      type: object
      properties:
        url:
          type: string
          description: URL of the system under test
          example: https://example.com/
        name:
          type: string
          description: Test run name
          example: My test name
        context:
          description: Test run context
          allOf:
            - $ref: '#/components/schemas/TestRunContext'
        guidance:
          description: Guidance to help the agent to execute the test
          type: array
          items:
            $ref: '#/components/schemas/TextualData'
        attachments:
          description: Attached files
          type: array
          items:
            $ref: '#/components/schemas/CreateAttachment'
        webhooks:
          description: Webhooks to call after a test ended
          example:
            - https://my-webhook.com/test-result
          type: array
          items:
            type: string
        steps:
          description: Test steps
          type: array
          items:
            $ref: '#/components/schemas/CreateTestStep'
      required:
        - url
        - steps
    CreateTestBatch:
      type: object
      properties:
        sequential:
          type: boolean
          description: Whether tests are executed sequentially or in parallel
          example: true
          default: false
        stopOnFailure:
          type: boolean
          description: >-
            Whether to skip remaining tests when one fails (only relevant when
            sequential=true)
          example: true
          default: false
        tests:
          type: array
          description: Batch of tests to execute
          items:
            oneOf:
              - $ref: '#/components/schemas/CreateTest'
              - $ref: '#/components/schemas/CreateGherkinTest'
      required:
        - tests
    TestRunIds:
      type: object
      properties:
        testRunIds:
          description: List of ids
          example:
            - m626fwxopxr489raizu6hjgy
            - zcuk4l13zax1piz2h73imct6
          type: array
          items:
            type: string
      required:
        - testRunIds
    CreateGherkinTest:
      type: object
      properties:
        url:
          type: string
          description: URL of the system under test
          example: https://example.com/
        name:
          type: string
          description: Test run name
          example: My test name
        context:
          description: Test run context
          allOf:
            - $ref: '#/components/schemas/TestRunContext'
        guidance:
          description: Guidance to help the agent to execute the test
          type: array
          items:
            $ref: '#/components/schemas/TextualData'
        attachments:
          description: Attached files
          type: array
          items:
            $ref: '#/components/schemas/CreateAttachment'
        webhooks:
          description: Webhooks to call after a test ended
          example:
            - https://my-webhook.com/test-result
          type: array
          items:
            type: string
        scenario:
          type: string
          description: Gherkin scenario
          example: |-
            Given the user is connected
            When the user search for a book
            Then a list of books is displayed
      required:
        - url
        - scenario
    RunInitialReport:
      type: object
      properties:
        screenshot:
          type: string
          description: >-
            UUID of the screenshot captured at the very start of the run (base64
            string or URL depending on configuration).
          example: 4b111ba4-c236-4770-67bf-0f17d0230e47
        error:
          type: string
          description: High-level startup error.
          enum:
            - host_not_reachable
          example: host_not_reachable
    TestRunStatus:
      type: object
      properties:
        createdAt:
          format: date-time
          type: string
          description: Creation date
          example: '2025-09-18T08:59:00.000Z'
        initialReport:
          description: >-
            Initial environment capture before executing any step (screenshot
            UUID and a possible startup error).
          example:
            screenshot: 4b111ba4-c236-4770-67bf-0f17d0230e47
          allOf:
            - $ref: '#/components/schemas/RunInitialReport'
        status:
          type: string
          description: Run status
          enum:
            - waiting
            - running
            - success
            - failed
            - error
            - stopped
            - not_run
          example: running
        statusMessage:
          type: string
          description: Run status message
          example: Insufficient credits
        start:
          format: date-time
          type: string
          description: Start date
          example: '2025-09-18T09:00:00.000Z'
        end:
          format: date-time
          type: string
          description: End date
          example: '2025-09-18T09:05:27.000Z'
        expiration:
          format: date-time
          type: string
          description: Expiration date
          example: '2025-09-18T09:05:27.000Z'
      required:
        - createdAt
        - status
    StopTestRuns:
      type: object
      properties:
        testRunIds:
          description: List of ids
          example:
            - m626fwxopxr489raizu6hjgy
            - zcuk4l13zax1piz2h73imct6
          type: array
          items:
            type: string
      required:
        - testRunIds
    StoppedTestRuns:
      type: object
      properties:
        stoppedTestRunIds:
          description: List of ids
          example:
            - m626fwxopxr489raizu6hjgy
            - zcuk4l13zax1piz2h73imct6
          type: array
          items:
            type: string
      required:
        - stoppedTestRunIds
    TimePeriod:
      type: object
      properties:
        count:
          type: number
          example: 3
          description: How many units (e.g., 3 hours)
        unit:
          type: string
          enum:
            - m
            - h
            - d
            - M
          description: 'Unit: minutes, hours, days, months'
      required:
        - count
        - unit
    TestRunsFilter:
      type: object
      properties:
        statuses:
          type: array
          description: Filter test runs by statuses
          items:
            type: string
            enum:
              - waiting
              - running
              - success
              - failed
              - error
              - stopped
              - not_run
        relativePeriod:
          description: 'Relative time period like { count: 3, unit: "h" } for last 3 hours'
          allOf:
            - $ref: '#/components/schemas/TimePeriod'
        startDate:
          format: date-time
          type: string
          description: Start date for custom period
        endDate:
          format: date-time
          type: string
          description: End date for custom period
        apiKeyIds:
          description: Filter test runs by API key IDs
          type: array
          items:
            type: string
        testRunIds:
          description: Filter test runs by IDs
          type: array
          items:
            type: string
    Screenshot:
      type: object
      properties:
        data:
          type: string
          description: Screenshot in base64 format
      required:
        - data
    Attachment:
      type: object
      properties:
        name:
          type: string
          description: Name of the attachment
          example: invoice_260313.pdf
        id:
          type: string
          description: UUID of the attachment
      required:
        - name
        - id
    Webhook:
      type: object
      properties:
        url:
          type: string
          description: URL of the webhook
          example: https://myapi.com/test-result
        code:
          type: number
          description: Status code of the request
          example: 200
        error:
          type: string
          description: Error raised by the request, if any.
