info:
  name: Execute a batch of tests
  type: http
  seq: 2
  tags:
    - TestRuns

http:
  method: POST
  url: "{{baseUrl}}/testRuns/batch"
  headers:
    - name: x-api-consumer
      value: petit-robot:bruno
    - name: x-api-key
      value: "{{apiKey}}"
  body:
    type: json
    data: |-
      {
        "sequential": false,
        "tests": [
          {
            "url": "https://example.com/",
            "name": "Login flow (manual)",
            "context": {
              "clientLanguage": "en-US, english, en",
              "clientDatetime": "Thu Feb 26 2026 09:26:12 GMT+0100 (Central Europe time)"
            },
            "guidance": [
              {
                "text": "The user is between 18 and 49"
              }
            ],
            "webhooks": [
              "https://my-webhook.com/test-result"
            ],
            "steps": [
              {
                "action": "Click on the \"Login\" button",
                "expectedResult": "Verify that the user is logged-in"
              }
            ]
          },
          {
            "url": "https://example.com/",
            "name": "Search a book (gherkin)",
            "scenario": "Given the user is connected\nWhen the user search for a book\nThen a list of books is displayed"
          }
        ]
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        if (body && body.testRunIds) {
          bru.setVar("testRunIds", body.testRunIds);
          console.log("testRunIds captured:", body.testRunIds);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
